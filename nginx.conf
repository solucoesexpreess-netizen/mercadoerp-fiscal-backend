upstream backend_fiscal {
  server api:3000;
}

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name api.mercadoerp.app;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;

  # Rate limiting por IP
  limit_req_zone $binary_remote_addr zone=fiscal:10m rate=10r/s;

  location /api/v1/auth/ {
    limit_req zone=fiscal burst=5 nodelay;
    proxy_pass http://backend_fiscal;
  }

  location /api/v1/ {
    limit_req zone=fiscal burst=20 nodelay;
    proxy_pass http://backend_fiscal;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 10m; # upload de certificado PFX
  }
}